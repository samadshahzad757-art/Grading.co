<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Grading.co | Color Grading</title>
<meta name="description" content="Color grading for commercials, music videos and branded films, Films">
<link rel="canonical" href="https://www.grading.co/">
<meta property="og:type" content="website">
<meta property="og:title" content="Grading.co | Color Grading">
<meta property="og:description" content="Color grading for commercials, music videos, branded content and films by Samad Shahzad.">
<meta property="og:url" content="https://www.grading.co/">
<meta name="robots" content="index,follow">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b0c0f;--panel:#14161b;--line:#23262e;--text:#f2f3f5;--muted:#8d929c;--accent:#e5392f;--accent2:#ff8a3d;
--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,12,15,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:700;letter-spacing:-.02em}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:14px;color:var(--muted)}
nav ul a:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--text);transition:.25s}
.btn:hover{border-color:var(--text);transform:translateY(-2px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;box-shadow:0 8px 30px -8px var(--accent)}
.btn.primary:hover{box-shadow:0 12px 40px -6px var(--accent)}
.hero{position:relative;padding:110px 0 70px;text-align:center;overflow:hidden}
.glow{position:absolute;width:620px;height:620px;border-radius:50%;filter:blur(110px);opacity:.35;pointer-events:none;animation:float 12s ease-in-out infinite}
.g1{background:var(--accent);top:-260px;left:8%}.g2{background:#3b6bff;top:-200px;right:6%;animation-delay:-5s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:6px 14px;border-radius:999px;background:var(--panel)}
h1{font-size:clamp(40px,7vw,84px);line-height:1.02;letter-spacing:-.04em;margin:22px 0}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2),#3b6bff,var(--accent));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 8s linear infinite}
@keyframes shift{to{background-position:300% 0}}
.sub{color:var(--muted);max-width:560px;margin:0 auto 32px;font-size:18px}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ba{position:relative;max-width:900px;margin:60px auto 0;aspect-ratio:16/9;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 100px -30px rgba(229,57,47,.35);background:#050608}
.ba .ba-video{display:block;width:100%;height:100%;object-fit:cover;background:#050608}
.ba .tag{position:absolute;top:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:99px;pointer-events:none}
.ba .t1{left:14px}.ba .t2{right:14px}
.marq{margin-top:60px;overflow:hidden;border-block:1px solid var(--line);padding:22px 0;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.track{display:flex;gap:70px;width:max-content;animation:scroll 28s linear infinite;color:var(--muted);font-weight:600;font-size:20px;letter-spacing:-.01em}
@keyframes scroll{to{transform:translateX(-50%)}}

.showcase{padding:28px 0 90px}
.showcase-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px;flex-wrap:wrap}
.showcase-head h2{margin:0}
.showcase-head p{color:var(--muted);margin:0;max-width:430px}
.showcase-frame{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#050608;box-shadow:0 35px 90px -45px rgba(0,0,0,.9)}
.showcase-frame video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#050608}
.showcase-note{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:13px}
@media(max-width:760px){.showcase{padding:10px 0 65px}.showcase-head{display:block}.showcase-head p{margin-top:10px}}

section{padding:90px 0}
h2{font-size:clamp(30px,4.5vw,52px);letter-spacing:-.03em;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel);transition:transform .3s,border-color .3s;transform-style:preserve-3d;will-change:transform}
.card:hover{border-color:#444a55}
.card .im{position:absolute;inset:0;transition:transform .6s}
.card:hover .im{transform:scale(1.08)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-weight:600}
.card .cap small{display:block;color:var(--muted);font-weight:400}
.more{display:none;margin-top:18px}.more.open{display:grid}
.toggle{margin:26px auto 0;display:flex}
.about{display:grid;grid-template-columns:1fr 1.2fr;gap:50px;align-items:center}
.portrait{aspect-ratio:4/5;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,#2a2d35,#14161b);display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.about p{color:var(--muted);font-size:18px}.about p b{color:var(--text)}
.stats{display:flex;gap:36px;margin-top:30px;flex-wrap:wrap}
.stats b{display:block;font-size:44px;letter-spacing:-.03em;line-height:1}
.stats span{color:var(--muted);font-size:13px}
.cta{text-align:center;border:1px solid var(--line);border-radius:28px;padding:80px 24px;background:radial-gradient(ellipse at 50% 0,rgba(229,57,47,.22),transparent 70%),var(--panel)}
.cta p{color:var(--muted);font-size:18px;margin:0 0 28px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.box{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}}
.box h3{font-size:26px;margin:6px 0 4px;letter-spacing:-.02em}
.box .st{color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
.prog{height:3px;background:var(--line);border-radius:3px;margin:12px 0 18px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.opt{padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg);color:var(--text);font:inherit;transition:.2s}
.opt:hover,.opt.sel{border-color:var(--accent);background:rgba(229,57,47,.1)}
.box input,.box textarea{width:100%;margin:6px 0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit}
.x{float:right;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
#editbar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px}
#editbar .btn{background:var(--panel);font-size:13px;padding:9px 16px}
body.editing [data-e]{outline:1px dashed var(--accent2);outline-offset:3px;cursor:text}
@media(max-width:760px){nav ul{display:none}.about{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}} @media(max-width:480px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

const $=s=>document.querySelector(s),KEY="colorist-site-v1";
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const C={...CONFIG,...saved};
document.querySelectorAll("[data-e]").forEach(el=>el.textContent=C[el.dataset.e]);
$("#clients").innerHTML=[...C.clients,...C.clients].map(c=>`<span>${c}</span>`).join("");
const card=p=>`<a class="card rv" href="#contact"><div class="im" style="${p.img?`background:url(${p.img}) center/cover`:`background:radial-gradient(circle at 40% 40%,hsl(${p.hue} 85% 55%),hsl(${p.hue+30} 70% 20%) 60%,#07080b)`}"></div><div class="cap">${p.t}<small>${p.s}</small></div></a>`;
$("#main").innerHTML=C.projects.map(card).join("");$("#more").innerHTML=C.moreProjects.map(card).join("");
if(C.moreProjects.length){$("#tg").onclick=()=>{const o=$("#more").classList.toggle("open");$("#tg").textContent=o?"Less work −":"More work +";observe()};}else{$("#more").style.display="none";}
if(C.portrait)$("#portrait").innerHTML=`<img src="${C.portrait}" alt="Samad Shahzad portrait">`;
$("#stats").innerHTML=C.stats.map(s=>`<div><b data-n="${s.n}" data-x="${s.x}">0</b><span>${s.l}</span></div>`).join("");
/* before/after */

/* reveal + count up */
function count(el){const n=+el.dataset.n,t0=performance.now();(function f(t){const k=Math.min((t-t0)/1400,1);el.textContent=Math.round(n*(1-Math.pow(1-k,3)))+el.dataset.x;if(k<1)requestAnimationFrame(f)})(t0)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");e.target.querySelectorAll("[data-n]").forEach(count);io.unobserve(e.target)}}),{threshold:.15});
function observe(){document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el))}observe();
/* 3D tilt on cards */
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(800px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-4px)`});
document.addEventListener("pointerout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c)c.style.transform=""});
/* inquiry modal */
let st=0,d={};
function openModal(){st=0;d={};$("#modal").classList.add("open");render()}
function closeModal(){$("#modal").classList.remove("open")}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function render(){const s=$("#step");$("#stn").textContent=`${st+1} of 3`;$("#pg").style.width=(st+1)/3*100+"%";
 if(st==0){s.innerHTML=`<h3>What are you making?</h3><div style="color:var(--muted);font-size:14px">Choose the closest fit.</div><div class="opts">${C.inquiryTypes.map(t=>`<button class="opt ${d.type===t?"sel":""}" data-t="${t}">${t}</button>`).join("")}</div><button class="btn primary" id="nx">Continue →</button>`;
  s.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{d.type=b.dataset.t;render()});$("#nx").onclick=()=>{if(d.type){st=1;render()}}}
 else if(st==1){s.innerHTML=`<h3>Tell me about it</h3><input id="f1" placeholder="Your name" value="${d.name||""}"><input id="f2" type="email" placeholder="Email" value="${d.email||""}"><textarea id="f3" rows="3" placeholder="Project, timeline, format…">${d.msg||""}</textarea><div style="margin-top:10px"><button class="btn primary" id="nx">Continue →</button></div>`;
  $("#nx").onclick=()=>{d.name=$("#f1").value;d.email=$("#f2").value;d.msg=$("#f3").value;if(d.name&&d.email){st=2;render()}}}
 else{const sub=encodeURIComponent(`${d.type} inquiry from ${d.name}`),body=encodeURIComponent(`${d.msg}\n\n${d.name} · ${d.email}`);
  s.innerHTML=`<h3>Ready to send</h3><p style="color:var(--muted)">${d.type} · ${d.name} · ${d.email}</p><a class="btn primary" href="mailto:${C.email}?subject=${sub}&body=${body}">Send inquiry ↗</a>`}}
/* inline edit mode, saved in this browser */
let ed=false;
$("#eb").onclick=()=>{ed=!ed;document.body.classList.toggle("editing",ed);document.querySelectorAll("[data-e]").forEach(el=>el.contentEditable=ed);$("#eb").textContent=ed?"✓ Save":"✎ Edit text";$("#rs").style.display=ed?"":"none";
 if(!ed){const o={};document.querySelectorAll("[data-e]").forEach(el=>o[el.dataset.e]=el.textContent);try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}};
$("#rs").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
</script>
</body>
